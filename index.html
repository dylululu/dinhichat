<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DiNhiChat">
  <meta name="theme-color" content="#e91e63">
  <title>DiNhiChat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root {
      --primary-color: #e91e63;
      --primary-dark: #c2185b;
      --bg-gray: #fff2f7;
      --bubble-gray: #ffe1ed;
      --text-main: #421c2e;
      --text-muted: #85566c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Screen management */
    .screen {
      display: none;
      height: 100%;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .screen.active {
      display: flex;
    }

    /* Auth Screen */
    #auth-screen {
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .auth-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
    }

    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .auth-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-color);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:active {
      background-color: var(--primary-dark);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-error {
      color: #d32f2f;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* Chat Screen */
    #chat-screen {
      background: #fff7fa;
      height: 100%;
      position: relative;
    }

    .chat-header {
      position: relative;
      background: #ffe7f0;
      border-bottom: 1px solid #f4c3d5;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .header-title-wrap h1 {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-status {
      font-size: 12px;
      color: #34c759;
    }

    .header-actions {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-notify {
      background: #fff0f5;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-notify:active {
      background: #ffe0ec;
    }

    .btn-logout {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 6px;
    }

    .btn-cover {
      border: 0;
      border-radius: 16px;
      padding: 6px 8px;
      background: #ffd9e8;
      font-size: 17px;
      cursor: pointer;
    }

    .cover-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 30;
      min-width: 190px;
      padding: 5px;
      background: #fff0f6;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16);
      flex-direction: column;
    }

    .cover-menu.open {
      display: flex;
    }

    .cover-menu button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: transparent;
      color: var(--text-main);
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .cover-menu button:active {
      background: #ffe0ec;
    }

    /* Notice Banner */
    .notice-banner {
      background: #fff8e1;
      color: #b78103;
      padding: 8px 14px;
      font-size: 12px;
      text-align: center;
      border-bottom: 1px solid #ffe082;
      display: none;
    }

    /* Messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fff0f6;
    }

    .chat-messages.has-cover {
      background-color: #fff0f6;
      background-image: linear-gradient(rgba(255, 225, 237, .42), rgba(255, 225, 237, .42)), var(--chat-cover-image);
      background-position: center;
      background-size: cover;
      background-attachment: scroll;
    }

    .chat-messages.has-cover .message-row.other .message-bubble {
      background-color: rgba(255, 225, 237, .92);
    }

    /* iPhone viewport, safe areas and compact layouts */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    body { height: 100dvh; padding: 0; }
    .screen { height: 100%; height: 100dvh; }
    #auth-screen, #chat-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: none;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    #auth-screen {
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    #chat-screen { min-height: 0; }
    .chat-header {
      flex-wrap: nowrap;
      min-height: calc(52px + env(safe-area-inset-top));
      padding: calc(env(safe-area-inset-top) + 8px) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      gap: 8px;
    }
    .header-user-info, .header-actions { min-width: 0; flex-shrink: 0; gap: 8px; }
    .header-user-info { flex: 1; }
    .header-avatar { width: 28px; height: 28px; flex: 0 0 28px; }
    .header-title-wrap { min-width: 0; overflow: hidden; }
    .header-title-wrap h1 { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .header-status { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .header-actions { flex-shrink: 0; }
    .btn-notify, .btn-cover, .btn-logout, .btn-attach, .btn-send {
      min-width: 40px; min-height: 40px; flex-shrink: 0; touch-action: manipulation;
    }
    .chat-messages {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
    }
    .message-row { max-width: 78%; min-width: 0; }
    .message-bubble, .w .b {
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
      hyphens: auto;
      font-size: 16px;
      line-height: 1.35;
    }
    .reply-quote, .reply-quote-name, .reply-quote-text, .message-time,
    .message-seen-status, .sticker-sender, .nm, .typing-indicator {
      max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }
    .reply-quote-name, .reply-quote-text, .message-time, .message-seen-status,
    .sticker-sender, .nm { white-space: nowrap; }
    .msg-image { width: auto; height: auto; max-width: 100%; max-height: 60dvh; }
    .msg-image-wrap { max-width: min(220px, 100%); }
    .msg-sticker { width: min(140px, 40vw); max-width: 100%; max-height: 40vw; }
    .chat-input-bar {
      flex-shrink: 0;
      padding: 8px max(10px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(10px, env(safe-area-inset-left));
      flex-wrap: wrap;
      max-width: 100vw;
    }
    .chat-input { flex: 1 1 60px; min-width: 0; font-size: 16px; max-height: 120px; }
    .btn-attach, .btn-send { min-width: 40px; min-height: 40px; padding: 8px; display: inline-flex; align-items: center; justify-content: center; }
    .remind-select { max-width: min(112px, 28vw); }
    .sticker-panel, .attach-menu, .cover-menu {
      max-width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 16px);
      max-height: min(50dvh, 360px);
      overflow: auto;
      overscroll-behavior: contain;
    }
    .sticker-panel { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); }
    .attach-menu { left: max(8px, env(safe-area-inset-left)); }
    .cover-menu { right: 0; }
    #new-messages-button { max-width: calc(100vw - 32px); white-space: nowrap; }
    #img-overlay { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #img-overlay img { width: auto; height: auto; max-width: 100vw; max-height: 100dvh; object-fit: contain; }
    .send-gather-overlay { width: 100vw; max-width: 100vw; overflow: hidden; }
    .send-flying-text, .send-flying-character, .send-flying-heart { max-width: 100vw; }
    .typing-indicator { padding: 2px 0; font-size: 12px; line-height: 1.2; }

    @media (max-width: 360px) {
      .chat-header { gap: 6px; padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
      .header-user-info, .header-actions { gap: 6px; }
      .btn-notify, .btn-cover, .btn-logout { width: 36px; min-width: 40px; padding: 8px 10px; font-size: 0; justify-content: center; }
      .btn-notify::before { content: '🔔'; font-size: 16px; }
      .btn-cover::before { content: '🖼️'; font-size: 16px; }
      .btn-logout::before { content: '↪'; font-size: 16px; }
      .message-row { max-width: 82%; }
      .chat-input-bar { gap: 6px; }
      .remind-select { max-width: 92px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .chat-header { padding-top: calc(env(safe-area-inset-top) + 4px); padding-bottom: 4px; }
      .message-row { max-width: 65%; }
      .sticker-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .sticker-panel, .attach-menu, .cover-menu { max-height: 50dvh; }
    }

    .chat-messages.has-cover .message-time,
    .chat-messages.has-cover .message-seen-status,
    .chat-messages.has-cover .sticker-sender {
      color: #333;
      text-shadow: 0 1px 3px rgba(255, 255, 255, .8);
    }

    @media (prefers-color-scheme: dark) {
      .chat-messages.has-cover {
        background-image: linear-gradient(rgba(0, 0, 0, .35), rgba(0, 0, 0, .35)), var(--chat-cover-image);
      }

      .chat-messages.has-cover .message-time,
      .chat-messages.has-cover .message-seen-status,
      .chat-messages.has-cover .sticker-sender {
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
      }
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      position: relative;
      touch-action: pan-y;
      will-change: transform;
    }

    .message-row.animate-outgoing { animation: message-outgoing 320ms cubic-bezier(.2,.9,.3,1.2) both; transform-origin: bottom right; }
    .message-row.animate-incoming { animation: message-incoming 260ms ease-out both; transform-origin: center left; }
    @keyframes message-outgoing {
      0% { transform: translateY(24px) scale(.85); opacity: 0; }
      72% { transform: translateY(0) scale(1.04); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes message-incoming {
      from { transform: translateX(-16px) scale(.95); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }
    .message-row.is-sending { opacity: .6; transition: opacity 200ms ease; }
    .message-row.send-error { opacity: 1; outline: 1px solid #d32f2f; outline-offset: 2px; border-radius: 12px; }
    .message-row.send-error .message-bubble { border: 1px solid #d32f2f; }
    .retry-send { margin: 4px 4px 0; padding: 3px 8px; border: 0; border-radius: 10px; background: #fff0f6; color: #c2185b; font-size: 12px; cursor: pointer; }

    #new-messages-button {
      display: none;
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
      padding: 8px 14px;
      border: 0;
      border-radius: 18px;
      background: #e91e63;
      color: #fff;
      box-shadow: 0 3px 12px #0002;
      cursor: pointer;
    }
    #new-messages-button.visible { display: block; }

    .send-heart {
      position: fixed;
      z-index: 2000;
      left: var(--heart-x);
      top: var(--heart-y);
      font-size: var(--heart-size);
      line-height: 1;
      pointer-events: none;
      animation: send-heart-fly 700ms ease-out both;
      will-change: transform, opacity;
    }
    .send-gather-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      overflow: hidden;
      pointer-events: none;
    }
    .send-gather-particle {
      position: absolute;
      line-height: 1;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(233, 30, 99, .8), 0 0 12px #fff;
      filter: drop-shadow(0 0 5px rgba(233, 30, 99, .65));
      will-change: transform, opacity;
    }
    .send-gather-ripple {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2px solid rgba(233, 30, 99, .7);
      border-radius: 50%;
      background: rgba(255, 105, 180, .12);
      will-change: transform, opacity;
    }
    .send-flying-text {
      position: fixed;
      z-index: 1;
      display: block;
      overflow: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      pointer-events: none;
      transform-origin: top left;
      will-change: transform, opacity;
    }
    .send-flying-character,
    .send-flying-heart {
      position: fixed;
      z-index: 1;
      pointer-events: none;
      will-change: transform, opacity;
    }
    .send-flying-character { color: var(--primary-color); font-size: 15px; font-weight: 600; }
    .send-flying-heart { font-size: 13px; }
    @keyframes send-heart-fly {
      from { transform: translate(0, 0) scale(.75); opacity: 1; }
      to { transform: translate(var(--heart-dx), -74px) scale(1.15); opacity: 0; }
    }
    .btn-send { transition: transform 150ms ease, opacity 150ms ease; transform-origin: center; }
    .btn-send.is-empty { opacity: 0; transform: scale(.75); pointer-events: none; }
    .btn-send.is-pressed { animation: send-button-pop 150ms ease-out; }
    @keyframes send-button-pop { 0% { transform: scale(.88); } 100% { transform: scale(1); } }

    .reply-swipe-icon {
      position: absolute;
      left: -34px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary-color);
      font-size: 22px;
      opacity: 0;
      pointer-events: none;
    }

    .message-row.swiping .reply-swipe-icon {
      opacity: 1;
    }

    .message-row.reply-flash .message-bubble,
    .message-row.reply-flash .msg-image-wrap {
      box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.4);
    }

    .message-row.self {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message-content { transition: opacity 150ms ease; }

    .message-row.self .message-bubble {
      background-color: var(--primary-color);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.other .message-bubble {
      background-color: var(--bubble-gray);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .reply-quote {
      border-left: 3px solid #e91e63;
      background: rgba(255, 240, 246, 0.78);
      color: #777;
      font-size: 12px;
      line-height: 1.3;
      padding: 5px 7px;
      margin: -2px -4px 7px;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
    }

    .message-row.other .reply-quote {
      background: rgba(255, 240, 246, 0.92);
    }

    .reply-quote-name,
    .reply-quote-text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .reply-quote-name {
      font-weight: 700;
      color: #666;
      -webkit-line-clamp: 1;
    }

    .reply-quote-text {
      -webkit-line-clamp: 1;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Image bubble */
    .msg-image {
      max-width: 100%;
      border-radius: 14px;
      display: block;
      min-height: 150px;
      background: #eee;
      cursor: pointer;
      object-fit: cover;
    }

    .msg-image-wrap {
      padding: 4px;
      border-radius: 18px;
      overflow: hidden;
      max-width: 220px;
    }

    .sticker-panel {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: calc(100% + 6px);
      z-index: 12;
      max-height: 270px;
      padding: 10px;
      border-radius: 16px;
      background: #fff0f6;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16);
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
    }

    .sticker-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .sticker-item {
      min-width: 0;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      background: #ffe4ee;
      padding: 5px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .sticker-item img {
      display: block;
      width: 100%;
      max-width: 58px;
      height: 58px;
      object-fit: contain;
      background: transparent;
    }

    .sticker-add {
      color: var(--primary-color);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    .sticker-sender {
      color: var(--text-muted);
      font-size: 11px;
      margin: 0 5px 2px;
    }

    .msg-sticker {
      display: block;
      width: auto;
      max-width: 140px;
      max-height: 140px;
      object-fit: contain;
      background: transparent;
    }

    .message-row.self .msg-image-wrap {
      background: var(--primary-color);
      border-bottom-right-radius: 4px;
    }

    .message-row.other .msg-image-wrap {
      background: var(--bubble-gray);
      border-bottom-left-radius: 4px;
    }

    /* Image Overlay */
    #img-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #img-overlay.open {
      display: flex;
    }

    #img-overlay img {
      max-width: 95vw;
      max-height: 92vh;
      border-radius: 8px;
      object-fit: contain;
    }

    /* Chat Input */
    .chat-input-bar {
      padding: 8px 10px;
      background: #ffe7f0;
      border-top: 1px solid #f4c3d5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      flex-shrink: 0;
      position: relative;
      box-sizing: border-box;
      width: 100%;
    }

    .push-note {
      display: none;
      flex: 0 0 100%;
      width: 100%;
      color: var(--text-muted);
      font-size: 11px;
      padding: 0 4px;
    }

    .reply-bar {
      display: none;
      flex: 0 0 100%;
      width: 100%;
      order: -1;
      align-items: center;
      gap: 8px;
      padding: 5px 4px 7px;
      color: #666;
      font-size: 12px;
      border-left: 3px solid #e91e63;
      background: #fff0f6;
      border-radius: 8px;
    }

    .reply-bar-text {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .reply-cancel {
      border: 0;
      background: transparent;
      color: #704054;
      font-size: 18px;
      line-height: 1;
      padding: 3px 6px;
      cursor: pointer;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      min-height: 40px;
      max-height: 120px;
      padding: 9px 12px;
      border: 1px solid #edb7cb;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.35;
      font-family: inherit;
      outline: none;
      resize: none;
      overflow-y: hidden;
      background: #fff7fa;
      color: var(--text-main);
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .remind-select {
      flex-shrink: 0;
      max-width: 112px;
      padding: 8px 4px;
      border-radius: 14px;
      border: 1px solid #edb7cb;
      font-size: 11px;
      background: #fff0f6;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-send {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-send:active {
      background-color: var(--primary-dark);
    }

    .btn-attach {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Attach menu */
    .attach-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 14px;
      background: #fff0f6;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.14);
      overflow: hidden;
      z-index: 10;
      flex-direction: column;
      min-width: 160px;
    }

    .attach-menu.open {
      display: flex;
    }

    .attach-menu-item {
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      background: transparent;
      border: none;
      text-align: left;
    }

    .attach-menu-item:active {
      background: #ffe0ec;
    }

    .w {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .wm {
      align-self: flex-end;
      align-items: flex-end;
    }

    .wt {
      align-self: flex-start;
      align-items: flex-start;
    }

    .w .b {
      max-width: 100%;
    }

    .nm {
      font-size: 12px;
      color: #888;
      margin: 0 6px 2px;
    }

    .typing-indicator {
      display: none;
      font-size: 12px;
      color: #8e8e93;
      padding: 4px 16px;
      font-style: italic;
      background: transparent;
      flex-shrink: 0;
    }

    .message-seen-status {
      font-size: 11px;
      color: #8e8e93;
      text-align: right;
      margin-top: 2px;
      padding: 0 4px;
      transition: opacity 200ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .message-row.animate-outgoing, .message-row.animate-incoming { animation: message-fade 120ms ease-out both; }
      @keyframes message-fade { from { opacity: 0; } to { opacity: 1; } }
      .send-heart { display: none; animation: none; }
      .btn-send, .message-row.is-sending, .message-seen-status { transition-duration: 120ms; }
      .btn-send.is-pressed { animation: none; }
      .message-content { transition-duration: 120ms; }
    }
  </style>
</head>

<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <img src="icon-192.png" alt="DiNhiChat Logo" class="auth-logo">
      <h1 class="auth-title">DiNhiChat</h1>
      <p class="auth-desc">Chat riêng tư cho 2 người</p>
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="input-field" placeholder="email@example.com" required
            autocomplete="username">
        </div>
        <div class="input-group">
          <label for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" class="input-field" placeholder="Mật khẩu" required
            autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login" class="btn">Đăng nhập</button>
        <div id="login-error" class="auth-error"></div>
      </form>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen">
    <header class="chat-header">
      <div class="header-user-info">
        <div class="header-avatar" id="current-user-avatar">DN</div>
        <div class="header-title-wrap">
          <h1 id="chat-title">DiNhiChat</h1>
          <div class="header-status" id="user-status">Trực tuyến</div>
          <div id="typing-indicator" class="typing-indicator"></div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-enable-notify" class="btn-notify">🔔 Bật thông báo</button>
        <button id="btn-cover" class="btn-cover" type="button" aria-label="Ảnh bìa">🖼️</button>
        <div id="cover-menu" class="cover-menu">
          <button id="cover-change" type="button">Đổi ảnh bìa</button>
          <button id="cover-remove" type="button">Xóa ảnh bìa (về mặc định)</button>
        </div>
        <button id="btn-logout" class="btn-logout">Thoát</button>
      </div>
    </header>
    <input type="file" id="cover-file" accept="image/*" style="display:none">

    <div id="pwa-install-banner" class="notice-banner">
      Để nhận thông báo trên iPhone: Bấm nút <strong>Chia sẻ</strong> (biểu tượng hộp có mũi tên) → <strong>Thêm vào Màn
        hình chính</strong>.
    </div>

    <main class="chat-messages" id="messages-container">
      <!-- Bubbles will be rendered here -->
    </main>

    <footer class="chat-input-bar">
      <button id="new-messages-button" type="button">↓ Tin mới</button>
      <div id="reply-bar" class="reply-bar">
        <div id="reply-bar-text" class="reply-bar-text"></div>
        <button id="reply-cancel" class="reply-cancel" type="button" aria-label="Hủy trả lời">✕</button>
      </div>
      <!-- Attach menu -->
      <div id="attach-menu" class="attach-menu">
        <button class="attach-menu-item" id="btn-camera">📷 Chụp ảnh</button>
        <button class="attach-menu-item" id="btn-gallery">🖼️ Thư viện</button>
      </div>
      <div id="sticker-panel" class="sticker-panel" aria-hidden="true">
        <div id="sticker-grid" class="sticker-grid"></div>
      </div>
      <!-- Hidden file inputs -->
      <input type="file" id="file-camera" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="file-gallery" accept="image/*" multiple style="display:none">
      <input type="file" id="file-sticker" accept="image/png,image/webp,image/*" multiple style="display:none">

      <button id="btn-attach" class="btn-attach" type="button">📎</button>
      <button id="btn-sticker" class="btn-attach" type="button" aria-label="Mở sticker">🎟️</button>
      <textarea id="message-input" class="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off" rows="1"></textarea>
      <select id="remind-select" class="remind-select">
        <option value="none" selected>🔕 Không nhắc</option>
        <option value="1">🔔 1 lần</option>
        <option value="2">🔔 2 lần</option>
        <option value="loop">🔁 Liên tục</option>
      </select>
      <button id="btn-send" class="btn-send">Gửi</button>
      <div id="peer-push-notice" class="push-note">Iu dấu chưa bật thông báo, có thể chưa thấy tin ngay</div>
      <div id="notification-help" class="push-note"></div>
    </footer>
  </div>

  <!-- Image full-screen overlay -->
  <div id="send-gather-overlay" class="send-gather-overlay" aria-hidden="true"></div>
  <div id="img-overlay">
    <img id="img-overlay-img" src="" alt="">
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
