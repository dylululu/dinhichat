<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DiNhiChat">
  <meta name="theme-color" content="#e91e63">
  <title>DiNhiChat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root {
      --primary-color: #e91e63;
      --primary-dark: #c2185b;
      --bg-gray: #fff2f7;
      --bubble-gray: #ffe1ed;
      --text-main: #421c2e;
      --text-muted: #85566c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-main);
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Screen management */
    .screen {
      display: none;
      height: 100%;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .screen.active {
      display: flex;
    }

    /* Auth Screen */
    #auth-screen {
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .auth-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
    }

    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .auth-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-color);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:active {
      background-color: var(--primary-dark);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-error {
      color: #d32f2f;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* Chat Screen */
    #app {
      background: transparent;
      height: 100%;
      position: relative;
    }

    .chat-header {
      position: relative;
      background: #ffe7f0;
      border-bottom: 1px solid #f4c3d5;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .header-title-wrap h1 {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-status {
      font-size: 12px;
      color: #34c759;
    }

    .header-actions {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-notify {
      background: #fff0f5;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-notify:active {
      background: #ffe0ec;
    }

    .btn-logout {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 6px;
    }

    .btn-cover {
      border: 0;
      border-radius: 16px;
      padding: 6px 8px;
      background: #ffd9e8;
      font-size: 17px;
      cursor: pointer;
    }

    .cover-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 20;
      min-width: 190px;
      padding: 5px;
      background: #fff0f6;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16);
      flex-direction: column;
    }

    .cover-menu.open {
      display: flex;
    }

    .cover-menu button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: transparent;
      color: var(--text-main);
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .cover-menu button:active {
      background: #ffe0ec;
    }

    /* Notice Banner */
    .notice-banner {
      background: #fff8e1;
      color: #b78103;
      padding: 8px 14px;
      font-size: 12px;
      text-align: center;
      border-bottom: 1px solid #ffe082;
      display: none;
    }

    /* Messages area */
    #chat-cover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100vh + 120px);
      height: calc(100lvh + 120px);
      z-index: 0;
      pointer-events: none;
      background-color: #fff0f6;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transform: translateY(var(--cover-shift, 0px));
      transition: transform 220ms cubic-bezier(.2,.8,.2,1);
    }
    #chat-cover.has-cover {
      background-image: linear-gradient(rgba(255, 225, 237, .42), rgba(255, 225, 237, .42)), var(--chat-cover-image);
    }
    #auth-screen { z-index: 2; }
    #app { z-index: 1; background: transparent; }
    .chat-header { position: relative; z-index: 10; }
    .chat-messages, .chat-input-bar { position: relative; z-index: 1; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent;
    }

    #kb {
      position: relative;
      display: flex;
      flex: 0 0 0;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0;
      height: auto;
      width: 100%;
      padding-bottom: 0;
      box-sizing: border-box;
      overflow: hidden;
      transform: translateY(100%);
      opacity: 0;
      visibility: hidden;
      transition: flex-basis 220ms ease, padding 220ms ease,
        transform 220ms ease, opacity 180ms ease, visibility 220ms;
      background: #fce4ec;
      color: #39232c;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      contain: layout paint;
      will-change: transform;
      z-index: 15;
    }
    #kb.open {
      flex-basis: auto;
      height: auto;
      padding: 0 0 calc(env(safe-area-inset-bottom) + 6px);
      overflow: visible;
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }
    .kb-top { height: 32px; display: flex; justify-content: center; align-items: center; position: relative; flex: 0 0 32px; margin-bottom: 6px; }
    .kb-grip {
      position: absolute; left: 50%; transform: translateX(-50%); width: 32px; height: 4px; border: 0; border-radius: 8px; background: #e4a8bc; padding: 0;
      touch-action: none;
    }
    .kb-hide { position: static; flex: 0 0 56px; margin-left: auto; width: 56px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: #f8bbd0; color: inherit; font-size: 22px; font-weight: 700; line-height: 1; z-index: 2; }
    .kb-rows { display: flex; flex: 0 0 auto; flex-direction: column; gap: 10px; padding: 0 5px; height: auto; box-sizing: border-box; }
    .kb-key-row { display: flex; justify-content: center; gap: 6px; flex: 0 0 46px; height: 46px; min-height: 46px; }
    .kb-key {
      flex: 1 1 0; min-width: 0; min-height: 40px; border: 0; border-radius: 6px; padding: 6px 3px;
      background: #fff; color: #33252b; box-shadow: 0 1px 0 rgba(0,0,0,.3);
      font: 22px/1 Arial,sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none;
      transition: transform 70ms ease, opacity 70ms ease;
    }
    .kb-key:active, .kb-key.pressed { transform: scale(.92); background: #f8bbd0; }
    .kb-key.function { background: #f8bbd0; font-size: 15px; }
    .kb-key.enter { background: #e91e63; color: #fff; font-size: 17px; }
    .kb-key.wide, .kb-letters .kb-key.function { flex: 1.4 1 0; }
    .kb-key.space { flex: 1 1 0; position: relative; }
    .kb-space-label { position: absolute; width: 48px; height: 100%; top: 0; left: 50%; display: grid; place-items: center; transform: translateX(-50%); font-size: 12px; font-weight: 600; opacity: .72; pointer-events: none; }
    .kb-lang-toast { position: absolute; z-index: 20; left: 50%; top: -34px; transform: translateX(-50%) translateY(4px); padding: 6px 12px; border-radius: 14px; background: rgba(233,30,99,.94); color: #fff; font-size: 13px; line-height: 18px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 140ms ease, transform 140ms ease; }
    .kb-lang-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .kb-bottom-row .kb-key[data-kb-key="symbols"] { flex: 0 0 44px; font-size: 15px; }
    .kb-bottom-row .kb-key[data-kb-key="emoji"] { flex: 0 0 44px; font-size: 20px; }
    .kb-bottom-row .kb-key.lang { flex: 0 0 48px; font-size: 15px; font-weight: 700; }
    .kb-bottom-row .kb-key.lang.vi-active { color: #c2185b; background: #f8bbd0; }
    .kb-bottom-row .kb-key.lang.en-active { color: #777; background: #f2edf0; }
    .kb-bottom-row .kb-key.enter { flex: 0 0 80px; }
    .kb-bottom-row .kb-key.space { min-width: 36px; }
    .kb-letters { display: flex; flex: 0 0 auto; flex-direction: column; justify-content: flex-start; gap: 10px; }
    .kb-letters .kb-key-row, .kb-symbols .kb-key-row { flex: 0 0 46px; height: 46px; gap: 6px; }
    .kb-letters .kb-key-row:nth-child(2) .kb-key { flex: 0 0 calc((100% - 54px) / 10); }
    .kb-letters .kb-key-row:nth-child(3) { gap: 6px; }
    .kb-letters .kb-key-row:nth-child(3) .kb-key.function:first-child { margin-right: 6px; }
    .kb-letters .kb-key-row:nth-child(3) .kb-key.function:last-child { margin-left: 6px; }
    .kb-key.function.shift-on { background: #fff; color: #33252b; font-size: 19px; }
    .kb-key.function.caps-lock { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .kb-symbols:not([hidden]) { display: flex; flex: 0 0 auto; flex-direction: column; justify-content: flex-start; gap: 10px; }
    .kb-bottom-row { flex: 0 0 46px; height: 46px; min-height: 46px; gap: 6px; align-items: center; }
    .kb-emoji-picker { display: none; flex: 0 0 221px; height: 221px; flex-direction: column; gap: 3px; }
    #kb.emoji-mode .kb-letters, #kb.emoji-mode .kb-symbols, #kb.emoji-mode .kb-bottom-row { display: none; }
    #kb.emoji-mode .kb-emoji-picker { display: flex; }
    .kb-emoji-tabs { flex: 0 0 34px; display: flex; gap: 3px; align-items: center; }
    .kb-emoji-tabs button { min-width: 34px; height: 32px; flex: 1; border: 0; border-radius: 8px; background: #f8bbd0; color: inherit; font-size: 12px; padding: 0 2px; }
    .kb-emoji-tabs button.active { background: #e91e63; color: #fff; }
    .kb-emoji-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(8,minmax(0,1fr)); grid-auto-rows: 44px; gap: 2px; align-content: start; }
    .kb-emoji { width: 100%; height: 44px; padding: 0; border: 0; border-radius: 8px; background: #fff; font-size: 26px; line-height: 1; }
    .kb-popover { position: absolute; left: 0; top: 0; z-index: 4; width: 52px; height: 58px; border-radius: 14px; background: #fff; color: #33252b; box-shadow: 0 2px 12px rgba(0,0,0,.22); font-size: 34px; line-height: 58px; text-align: center; pointer-events: none; opacity: 0; contain: layout paint; will-change: transform; transform: translate3d(var(--kb-pop-x, 0px), var(--kb-pop-y, 0px), 0) translateX(-50%) scale(.9); transition: transform 70ms ease, opacity 70ms ease; }
    .kb-popover.visible { opacity: 1; transform: translate3d(var(--kb-pop-x, 0px), var(--kb-pop-y, 0px), 0) translateX(-50%) scale(1); }
    #kb-toggle { display: none; min-width: 40px; min-height: 40px; border: 0; border-radius: 10px; background: #f8bbd0; font-size: 18px; }
    body.native-keyboard-mode #kb-toggle { display: inline-flex; align-items: center; justify-content: center; }
    @media (prefers-color-scheme: dark) {
      #kb { background: #3a1d2a; color: #fff; }
      #kb .kb-hide { background: #3a1d2a; color: #fff; }
      .kb-key, .kb-emoji { background: #5a2d40; color: #fff; box-shadow: 0 2px 2px rgba(0,0,0,.3); }
      .kb-key.function { background: #3a1d2a; }
      .kb-key.function.shift-on { background: #5a2d40; color: #fff; }
      .kb-key:active, .kb-key.pressed { background: #8b4965; }
      .kb-key.enter { background: #e91e63; }
      .kb-emoji-tabs button { background: #704057; color: #fff; }
      .kb-emoji-tabs button.active { background: #e91e63; }
      .kb-emoji { background: #5a2d40; color: #fff; }
      .kb-popover { background: #5a2d40; color: #fff; }
      .kb-grip { background: #a96a83; }
    }
    @media (max-width: 360px) {
      .kb-rows { padding-left: 4px; padding-right: 4px; }
      .kb-bottom-row { gap: 4px; }
      .kb-bottom-row .kb-key[data-kb-key="symbols"], .kb-bottom-row .kb-key[data-kb-key="emoji"] { flex-basis: 40px; }
      .kb-bottom-row .kb-key.lang { flex-basis: 44px; }
      .kb-bottom-row .kb-key.enter { flex-basis: 68px; }
      .kb-bottom-row .kb-key.space { min-width: 24px; }
    }

    .chat-messages.has-cover .message-row.other .message-bubble {
      background-color: rgba(255, 225, 237, .92);
    }

    /* iPhone viewport, safe areas and compact layouts */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    body { padding: 0; }
    .screen { height: 100%; height: 100dvh; }
    #auth-screen, #app {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: auto;
      width: 100%;
      max-width: none;
      height: var(--vvh, 100%);
      transform: translateY(var(--vvt, 0px));
      overflow: hidden;
    }
    #auth-screen.active, #app.active { display: flex; flex-direction: column; }
    #auth-screen {
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    #app { min-height: 0; }
    .chat-header {
      flex-wrap: nowrap;
      min-height: calc(52px + env(safe-area-inset-top));
      padding: calc(env(safe-area-inset-top) + 8px) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      gap: 8px;
    }
    body.kb .cover-menu { max-height: 40dvh; overflow-y: auto; }
    .cover-toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      z-index: 20001;
      max-width: 90vw;
      padding: 8px 12px;
      border-radius: 16px;
      background: #8b123f;
      color: #fff;
      font-size: 12px;
      overflow-wrap: anywhere;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .header-user-info, .header-actions { min-width: 0; flex-shrink: 0; gap: 8px; }
    .header-user-info { flex: 1; }
    .header-avatar { width: 28px; height: 28px; flex: 0 0 28px; }
    .header-title-wrap { min-width: 0; overflow: hidden; }
    .header-title-wrap h1 { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .header-status { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .header-actions { flex-shrink: 0; }
    .btn-notify, .btn-cover, .btn-logout, .btn-attach, .btn-send {
      min-width: 40px; min-height: 40px; flex-shrink: 0; touch-action: manipulation;
    }
    .chat-messages {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overflow-anchor: none;
      contain: layout;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
    }
    .message-row { max-width: 78%; min-width: 0; }
    .message-bubble, .w .b {
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
      hyphens: auto;
      font-size: 16px;
      line-height: 1.35;
    }
    .reply-quote, .reply-quote-name, .reply-quote-text, .message-time,
    .message-seen-status, .sticker-sender, .nm, .typing-indicator {
      max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }
    .reply-quote-name, .reply-quote-text, .message-time, .message-seen-status,
    .sticker-sender, .nm { white-space: nowrap; }
    .msg-image { width: auto; height: auto; max-width: 100%; max-height: 60dvh; }
    .msg-image-wrap { max-width: min(220px, 100%); }
    .msg-sticker { width: min(140px, 40vw); max-width: 100%; max-height: 40vw; }
    .chat-input-bar {
      flex-shrink: 0;
      padding: 8px max(10px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(10px, env(safe-area-inset-left));
      flex-wrap: wrap;
      max-width: 100vw;
    }
    .chat-input { flex: 1 1 60px; min-width: 0; font-size: 16px; max-height: 120px; }
    .btn-attach, .btn-send { min-width: 40px; min-height: 40px; padding: 8px; display: inline-flex; align-items: center; justify-content: center; }
    .remind-select { max-width: min(112px, 28vw); }
    .sticker-panel, .attach-menu, .cover-menu {
      max-width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 16px);
      max-height: min(50dvh, 360px);
      overflow: auto;
      overscroll-behavior: contain;
    }
    .sticker-panel { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); }
    .attach-menu { left: max(8px, env(safe-area-inset-left)); }
    .cover-menu { right: 0; }
    #new-messages-button { max-width: calc(100vw - 32px); white-space: nowrap; }
    #img-overlay { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #img-overlay img { width: auto; height: auto; max-width: 100vw; max-height: 100dvh; object-fit: contain; }
    .send-gather-overlay { width: 100vw; max-width: 100vw; height: var(--vvh, 100dvh); overflow: hidden; }
    .send-flying-text, .send-flying-character, .send-flying-heart { max-width: 100vw; }
    .typing-indicator { padding: 2px 0; font-size: 12px; line-height: 1.2; }

    @media (max-width: 360px) {
      .chat-header { gap: 6px; padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
      .header-user-info, .header-actions { gap: 6px; }
      .btn-notify, .btn-cover, .btn-logout { width: 36px; min-width: 40px; padding: 8px 10px; font-size: 0; justify-content: center; }
      .btn-notify::before { content: '🔔'; font-size: 16px; }
      .btn-cover::before { content: '🖼️'; font-size: 16px; }
      .btn-logout::before { content: '↪'; font-size: 16px; }
      .message-row { max-width: 82%; }
      .chat-input-bar { gap: 6px; }
      .remind-select { max-width: 92px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .chat-header { padding-top: calc(env(safe-area-inset-top) + 4px); padding-bottom: 4px; }
      .message-row { max-width: 65%; }
      .sticker-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .sticker-panel, .attach-menu, .cover-menu { max-height: 50dvh; }
    }

    .chat-messages.has-cover .message-time,
    .chat-messages.has-cover .message-seen-status,
    .chat-messages.has-cover .sticker-sender {
      color: #333;
      text-shadow: 0 1px 3px rgba(255, 255, 255, .8);
    }

    @media (prefers-color-scheme: dark) {
      #chat-cover.has-cover {
        background-image: linear-gradient(rgba(0, 0, 0, .35), rgba(0, 0, 0, .35)), var(--chat-cover-image);
      }

      .chat-messages.has-cover .message-time,
      .chat-messages.has-cover .message-seen-status,
      .chat-messages.has-cover .sticker-sender {
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
      }
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      position: relative;
      touch-action: pan-y;
      will-change: transform;
    }

    .message-row.animate-outgoing { animation: message-outgoing 320ms cubic-bezier(.2,.9,.3,1.2) both; transform-origin: bottom right; }
    .message-row.animate-incoming { animation: message-incoming 260ms ease-out both; transform-origin: center left; }
    @keyframes message-outgoing {
      0% { transform: translateY(24px) scale(.85); opacity: 0; }
      72% { transform: translateY(0) scale(1.04); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes message-incoming {
      from { transform: translateX(-16px) scale(.95); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }
    .message-row.is-sending { opacity: .6; transition: opacity 200ms ease; }
    .message-row.send-error { opacity: 1; outline: 1px solid #d32f2f; outline-offset: 2px; border-radius: 12px; }
    .message-row.send-error .message-bubble { border: 1px solid #d32f2f; }
    .retry-send { margin: 4px 4px 0; padding: 3px 8px; border: 0; border-radius: 10px; background: #fff0f6; color: #c2185b; font-size: 12px; cursor: pointer; }

    #new-messages-button {
      display: none;
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
      padding: 8px 14px;
      border: 0;
      border-radius: 18px;
      background: #e91e63;
      color: #fff;
      box-shadow: 0 3px 12px #0002;
      cursor: pointer;
    }
    #new-messages-button.visible { display: block; }

    .send-heart {
      position: fixed;
      z-index: 2000;
      left: var(--heart-x);
      top: var(--heart-y);
      font-size: var(--heart-size);
      line-height: 1;
      pointer-events: none;
      animation: send-heart-fly 700ms ease-out both;
      will-change: transform, opacity;
    }
    .send-gather-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      overflow: hidden;
      pointer-events: none;
    }
    .send-gather-particle {
      position: absolute;
      line-height: 1;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(233, 30, 99, .8), 0 0 12px #fff;
      filter: drop-shadow(0 0 5px rgba(233, 30, 99, .65));
      will-change: transform, opacity;
    }
    .send-gather-ripple {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2px solid rgba(233, 30, 99, .7);
      border-radius: 50%;
      background: rgba(255, 105, 180, .12);
      will-change: transform, opacity;
    }
    .send-flying-text {
      position: fixed;
      z-index: 1;
      display: block;
      overflow: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      pointer-events: none;
      transform-origin: top left;
      will-change: transform, opacity;
    }
    .send-flying-character,
    .send-flying-heart {
      position: fixed;
      z-index: 1;
      pointer-events: none;
      will-change: transform, opacity;
    }
    .send-flying-character { color: var(--primary-color); font-size: 15px; font-weight: 600; }
    .send-flying-heart { font-size: 13px; }
    @keyframes send-heart-fly {
      from { transform: translate(0, 0) scale(.75); opacity: 1; }
      to { transform: translate(var(--heart-dx), -74px) scale(1.15); opacity: 0; }
    }
    .btn-send { transition: transform 150ms ease, opacity 150ms ease; transform-origin: center; }
    .btn-send.is-empty { opacity: 0; transform: scale(.75); pointer-events: none; }
    .btn-send.is-pressed { animation: send-button-pop 150ms ease-out; }
    @keyframes send-button-pop { 0% { transform: scale(.88); } 100% { transform: scale(1); } }

    .reply-swipe-icon {
      position: absolute;
      left: -34px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary-color);
      font-size: 22px;
      opacity: 0;
      pointer-events: none;
    }

    .message-row.swiping .reply-swipe-icon {
      opacity: 1;
    }

    .message-row.reply-flash .message-bubble,
    .message-row.reply-flash .msg-image-wrap {
      box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.4);
    }

    .message-row.self {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message-content { transition: opacity 150ms ease; }

    .message-row.self .message-bubble {
      background-color: var(--primary-color);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.other .message-bubble {
      background-color: var(--bubble-gray);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .reply-quote {
      border-left: 3px solid #e91e63;
      background: rgba(255, 240, 246, 0.78);
      color: #777;
      font-size: 12px;
      line-height: 1.3;
      padding: 5px 7px;
      margin: -2px -4px 7px;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
    }

    .message-row.other .reply-quote {
      background: rgba(255, 240, 246, 0.92);
    }

    .reply-quote-name,
    .reply-quote-text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .reply-quote-name {
      font-weight: 700;
      color: #666;
      -webkit-line-clamp: 1;
    }

    .reply-quote-text {
      -webkit-line-clamp: 1;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Image bubble */
    .msg-image {
      max-width: 100%;
      border-radius: 14px;
      display: block;
      min-height: 150px;
      background: #eee;
      cursor: pointer;
      object-fit: cover;
    }

    .msg-image-wrap {
      padding: 4px;
      border-radius: 18px;
      overflow: hidden;
      max-width: 220px;
    }

    .sticker-panel {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: calc(100% + 6px);
      z-index: 12;
      max-height: 270px;
      padding: 10px;
      border-radius: 16px;
      background: #fff0f6;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16);
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
    }

    .sticker-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .sticker-item {
      min-width: 0;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      background: #ffe4ee;
      padding: 5px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .sticker-item img {
      display: block;
      width: 100%;
      max-width: 58px;
      height: 58px;
      object-fit: contain;
      background: transparent;
    }

    .sticker-add {
      color: var(--primary-color);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    .sticker-sender {
      color: var(--text-muted);
      font-size: 11px;
      margin: 0 5px 2px;
    }

    .msg-sticker {
      display: block;
      width: auto;
      max-width: 140px;
      max-height: 140px;
      object-fit: contain;
      background: transparent;
    }

    .message-row.self .msg-image-wrap {
      background: var(--primary-color);
      border-bottom-right-radius: 4px;
    }

    .message-row.other .msg-image-wrap {
      background: var(--bubble-gray);
      border-bottom-left-radius: 4px;
    }

    /* Image Overlay */
    #img-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #img-overlay.open {
      display: flex;
    }

    #img-overlay img {
      max-width: 95vw;
      max-height: 92dvh;
      border-radius: 8px;
      object-fit: contain;
    }

    .cover-crop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      bottom: auto;
      height: var(--vvh, 100dvh);
      z-index: 20000;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 8px) max(12px, env(safe-area-inset-right))
        calc(env(safe-area-inset-bottom) + 12px) max(12px, env(safe-area-inset-left));
      box-sizing: border-box;
      overflow: hidden;
      background: #080808;
      color: #fff;
    }
    .cover-crop-overlay.open { display: flex; }
    .cover-crop-heading { flex: 0 0 auto; padding: 4px 0 10px; text-align: center; font-size: 15px; }
    .cover-crop-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 120px;
      width: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    #cover-crop-image {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: none;
      max-height: none;
      transform-origin: center center;
      touch-action: none;
      user-select: none;
      pointer-events: none;
      will-change: transform;
    }
    .cover-crop-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 0;
      outline: 2px solid #fff;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, .6);
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-sizing: border-box;
    }
    .cover-crop-zoom { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 0; font-size: 13px; }
    .cover-crop-zoom input { flex: 1; min-width: 0; accent-color: #ff5e9a; }
    .cover-crop-actions { display: flex; justify-content: center; gap: 10px; flex: 0 0 auto; }
    .cover-crop-actions button {
      min-width: 88px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 12px;
      background: #282328;
      color: #fff;
      font: inherit;
      font-size: 14px;
      touch-action: manipulation;
    }
    .cover-crop-actions #cover-crop-done { background: #e91e63; border-color: #e91e63; }
    .cover-crop-actions button:disabled { opacity: .6; }

    /* Chat Input */
    .chat-input-bar {
      padding: 8px 10px;
      background: #ffe7f0;
      border-top: 1px solid #f4c3d5;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 6px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      flex-shrink: 0;
      position: relative;
      box-sizing: border-box;
      width: 100%;
    }

    .push-note {
      display: none;
      flex: 0 0 100%;
      width: 100%;
      color: var(--text-muted);
      font-size: 11px;
      padding: 0 4px;
    }

    .reply-bar {
      display: none;
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: calc(100% + 6px);
      z-index: 30;
      width: auto;
      align-items: center;
      gap: 8px;
      padding: 5px 8px 7px;
      color: #666;
      font-size: 12px;
      border-left: 3px solid #e91e63;
      background: #fff0f6;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      box-sizing: border-box;
    }

    .reply-bar-text {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .reply-cancel {
      border: 0;
      background: transparent;
      color: #704054;
      font-size: 18px;
      line-height: 1;
      padding: 3px 6px;
      cursor: pointer;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      min-height: 40px;
      max-height: 120px;
      padding: 8px 12px;
      box-sizing: border-box;
      border: 1px solid #edb7cb;
      border-radius: 18px;
      font-size: 16px !important;
      line-height: 1.35;
      font-family: inherit;
      outline: none;
      resize: none;
      overflow-y: hidden;
      background: #fff7fa;
      color: var(--text-main);
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .remind-select {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      max-width: 40px;
      padding: 4px;
      border: 0;
      border-radius: 50%;
      font-size: 16px;
      background: transparent;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: manipulation;
    }
    .remind-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff0f6;
      font-size: 16px;
      line-height: 1;
    }
    .remind-badge {
      position: absolute;
      right: 2px;
      bottom: 2px;
      min-width: 12px;
      height: 12px;
      padding: 0 2px;
      border-radius: 7px;
      background: #e91e63;
      color: #fff;
      font: 9px/12px system-ui, sans-serif;
      text-align: center;
    }
    .remind-toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      z-index: 10000;
      max-width: 90vw;
      padding: 7px 12px;
      border-radius: 18px;
      background: rgba(55, 35, 45, .92);
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .btn-send {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-send:active {
      background-color: var(--primary-dark);
    }

    .btn-attach {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Attach menu */
    .attach-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 14px;
      background: #fff0f6;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.14);
      overflow: hidden;
      z-index: 10;
      flex-direction: column;
      min-width: 160px;
    }

    .attach-menu.open {
      display: flex;
    }

    .attach-menu-item {
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      background: transparent;
      border: none;
      text-align: left;
    }

    .attach-menu-item:active {
      background: #ffe0ec;
    }

    .w {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .wm {
      align-self: flex-end;
      align-items: flex-end;
    }

    .wt {
      align-self: flex-start;
      align-items: flex-start;
    }

    .w .b {
      max-width: 100%;
    }

    .nm {
      font-size: 12px;
      color: #888;
      margin: 0 6px 2px;
    }

    .typing-indicator {
      position: absolute;
      left: 38px;
      right: 0;
      top: 100%;
      margin-top: -2px;
      z-index: 2;
      display: block;
      height: 15px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: none;
      font-size: 12px;
      color: #8e8e93;
      padding: 0;
      font-style: italic;
      background: transparent;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .typing-indicator.visible { opacity: 1; transform: translateY(0); }

    .message-seen-status {
      font-size: 11px;
      color: #8e8e93;
      text-align: right;
      margin-top: 2px;
      padding: 0 4px;
      transition: opacity 200ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .message-row.animate-outgoing, .message-row.animate-incoming { animation: message-fade 120ms ease-out both; }
      @keyframes message-fade { from { opacity: 0; } to { opacity: 1; } }
      .send-heart { display: none; animation: none; }
      .btn-send, .message-row.is-sending, .message-seen-status { transition-duration: 120ms; }
      .btn-send.is-pressed { animation: none; }
      .message-content { transition-duration: 120ms; }
    }

    /* Keep the composer above iOS keyboard and prevent focus zoom hiding input text. */
    .chat-input { font-size: 16px !important; flex: 1 1 60px; min-width: 0; }
    body.kb #app .chat-input-bar {
      position: relative;
      z-index: 20;
      flex-shrink: 0;
      padding-bottom: 8px;
      background: #ffe7f0;
    }
    body.pink-kb-open #app .chat-input-bar { padding-bottom: 8px; }
    body.pink-kb-open .chat-input { caret-color: #e91e63; }
    body.kb #app .chat-input {
      display: block;
      visibility: visible;
      opacity: 1;
      color: var(--text-main);
      -webkit-text-fill-color: var(--text-main);
      font-size: 16px;
    }
    .send-gather-overlay { height: var(--vvh, 100dvh); bottom: auto; }
    input, textarea, select, [contenteditable] { font-size: 16px !important; }
  </style>
</head>

<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <img src="icon-192.png" alt="DiNhiChat Logo" class="auth-logo">
      <h1 class="auth-title">DiNhiChat</h1>
      <p class="auth-desc">Chat riêng tư cho 2 người</p>
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="input-field" placeholder="email@example.com" required
            autocomplete="username">
        </div>
        <div class="input-group">
          <label for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" class="input-field" placeholder="Mật khẩu" required
            autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login" class="btn">Đăng nhập</button>
        <div id="login-error" class="auth-error"></div>
      </form>
    </div>
  </div>

  <div id="chat-cover" aria-hidden="true"></div>

  <!-- Chat Screen -->
  <div id="app" class="screen">
    <header class="chat-header">
      <div class="header-user-info">
        <div class="header-avatar" id="current-user-avatar">DN</div>
        <div class="header-title-wrap">
          <h1 id="chat-title">DiNhiChat</h1>
          <div class="header-status" id="user-status">Trực tuyến</div>
          <div id="typing-indicator" class="typing-indicator"></div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-enable-notify" class="btn-notify">🔔 Bật thông báo</button>
        <button id="btn-cover" class="btn-cover" type="button" aria-label="Ảnh bìa">🖼️</button>
        <div id="cover-menu" class="cover-menu">
          <button id="cover-change" type="button">Đổi ảnh bìa</button>
          <button id="cover-remove" type="button">Xóa ảnh bìa (về mặc định)</button>
        </div>
        <button id="btn-logout" class="btn-logout">Thoát</button>
      </div>
    </header>
    <input type="file" id="cover-file" accept="image/*"
      style="position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0;pointer-events:none">

    <div id="pwa-install-banner" class="notice-banner">
      Để nhận thông báo trên iPhone: Bấm nút <strong>Chia sẻ</strong> (biểu tượng hộp có mũi tên) → <strong>Thêm vào Màn
        hình chính</strong>.
    </div>

    <main class="chat-messages" id="messages-container">
      <!-- Bubbles will be rendered here -->
    </main>

    <footer class="chat-input-bar">
      <button id="new-messages-button" type="button">↓ Tin mới</button>
      <div id="reply-bar" class="reply-bar">
        <div id="reply-bar-text" class="reply-bar-text"></div>
        <button id="reply-cancel" class="reply-cancel" type="button" aria-label="Hủy trả lời">✕</button>
      </div>
      <!-- Attach menu -->
      <div id="attach-menu" class="attach-menu">
        <button class="attach-menu-item" id="btn-camera">📷 Chụp ảnh</button>
        <button class="attach-menu-item" id="btn-gallery">🖼️ Thư viện</button>
      </div>
      <div id="sticker-panel" class="sticker-panel" aria-hidden="true">
        <div id="sticker-grid" class="sticker-grid"></div>
      </div>
      <!-- Hidden file inputs -->
      <input type="file" id="file-camera" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="file-gallery" accept="image/*" multiple style="display:none">
      <input type="file" id="file-sticker" accept="image/png,image/webp,image/*" multiple style="display:none">

      <button id="btn-attach" class="btn-attach" type="button">📎</button>
      <button id="btn-sticker" class="btn-attach" type="button" aria-label="Mở sticker">🎟️</button>
      <button id="kb-toggle" type="button" aria-label="Chuyển bàn phím">🌐</button>
      <textarea id="message-input" class="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off" rows="1"></textarea>
      <button id="remind-select" class="remind-select" type="button" value="none" aria-label="Không nhắc" title="Không nhắc">
        <span id="remind-icon" class="remind-icon" aria-hidden="true">🔕</span>
        <span id="remind-badge" class="remind-badge" aria-hidden="true" hidden>2</span>
      </button>
      <button id="btn-send" class="btn-send">Gửi</button>
      <div id="peer-push-notice" class="push-note">Iu dấu chưa bật thông báo, có thể chưa thấy tin ngay</div>
      <div id="notification-help" class="push-note"></div>
    </footer>
    <section id="kb" aria-label="Bàn phím DiNhiChat" aria-hidden="true">
      <div id="kb-popover" class="kb-popover" aria-hidden="true"></div>
      <div id="kb-lang-toast" class="kb-lang-toast" role="status" aria-live="polite"></div>
      <div class="kb-top"><span class="kb-grip" aria-hidden="true"></span><button id="kb-hide" class="kb-hide" type="button" aria-label="Ẩn bàn phím">⌄</button></div>
      <div class="kb-rows">
        <div class="kb-letters">
          <div class="kb-key-row"><button class="kb-key" data-kb-key="q">q</button><button class="kb-key" data-kb-key="w">w</button><button class="kb-key" data-kb-key="e">e</button><button class="kb-key" data-kb-key="r">r</button><button class="kb-key" data-kb-key="t">t</button><button class="kb-key" data-kb-key="y">y</button><button class="kb-key" data-kb-key="u">u</button><button class="kb-key" data-kb-key="i">i</button><button class="kb-key" data-kb-key="o">o</button><button class="kb-key" data-kb-key="p">p</button></div>
          <div class="kb-key-row"><button class="kb-key" data-kb-key="a">a</button><button class="kb-key" data-kb-key="s">s</button><button class="kb-key" data-kb-key="d">d</button><button class="kb-key" data-kb-key="f">f</button><button class="kb-key" data-kb-key="g">g</button><button class="kb-key" data-kb-key="h">h</button><button class="kb-key" data-kb-key="j">j</button><button class="kb-key" data-kb-key="k">k</button><button class="kb-key" data-kb-key="l">l</button></div>
          <div class="kb-key-row"><button class="kb-key function" data-kb-key="shift">⇧</button><button class="kb-key" data-kb-key="z">z</button><button class="kb-key" data-kb-key="x">x</button><button class="kb-key" data-kb-key="c">c</button><button class="kb-key" data-kb-key="v">v</button><button class="kb-key" data-kb-key="b">b</button><button class="kb-key" data-kb-key="n">n</button><button class="kb-key" data-kb-key="m">m</button><button class="kb-key function" data-kb-key="backspace">⌫</button></div>
        </div>
        <div class="kb-symbols" hidden>
          <div class="kb-key-row"><button class="kb-key" data-kb-key="1">1</button><button class="kb-key" data-kb-key="2">2</button><button class="kb-key" data-kb-key="3">3</button><button class="kb-key" data-kb-key="4">4</button><button class="kb-key" data-kb-key="5">5</button><button class="kb-key" data-kb-key="6">6</button><button class="kb-key" data-kb-key="7">7</button><button class="kb-key" data-kb-key="8">8</button><button class="kb-key" data-kb-key="9">9</button><button class="kb-key" data-kb-key="0">0</button></div>
          <div class="kb-key-row"><button class="kb-key" data-kb-key="-">-</button><button class="kb-key" data-kb-key="/">/</button><button class="kb-key" data-kb-key=":">:</button><button class="kb-key" data-kb-key=";">;</button><button class="kb-key" data-kb-key="(">(</button><button class="kb-key" data-kb-key=")">)</button><button class="kb-key" data-kb-key="₫">₫</button><button class="kb-key" data-kb-key="&amp;">&amp;</button><button class="kb-key" data-kb-key="@">@</button><button class="kb-key" data-kb-key="&quot;">&quot;</button></div>
          <div class="kb-key-row"><button class="kb-key function wide" data-kb-key="moreSymbols">#+=</button><button class="kb-key" data-kb-key=".">.</button><button class="kb-key" data-kb-key=",">,</button><button class="kb-key" data-kb-key="?">?</button><button class="kb-key" data-kb-key="!">!</button><button class="kb-key" data-kb-key="'">'</button><button class="kb-key function" data-kb-key="backspace">⌫</button></div>
        </div>
        <div id="kb-emoji-picker" class="kb-emoji-picker" hidden>
          <div class="kb-emoji-tabs" id="kb-emoji-tabs">
            <button type="button" data-emoji-category="recent">🕘</button><button type="button" data-emoji-category="heart">❤️ Tim</button><button type="button" data-emoji-category="face">😊 Mặt</button><button type="button" data-emoji-category="hand">👍 Tay</button><button type="button" data-emoji-category="other">🌙 Khác</button><button type="button" data-kb-key="letters">ABC</button><button type="button" data-kb-key="backspace">⌫</button>
          </div>
          <div id="kb-emoji-grid" class="kb-emoji-grid"></div>
        </div>
        <div class="kb-key-row kb-bottom-row"><button class="kb-key function wide" data-kb-key="symbols">123</button><button class="kb-key function" data-kb-key="emoji">😊</button><button class="kb-key function lang" data-kb-key="language" aria-label="Đổi tiếng Việt hoặc English">VI</button><button class="kb-key space" data-kb-key="space"><span id="kb-space-label" class="kb-space-label">VI</span></button><button class="kb-key enter" data-kb-key="newline">↵</button></div>
      </div>
    </section>
  </div>

  <div id="cover-crop-overlay" class="cover-crop-overlay" aria-hidden="true">
    <div class="cover-crop-heading">Kéo ảnh để chỉnh vị trí · chụm để thu phóng</div>
    <div id="cover-crop-stage" class="cover-crop-stage">
      <img id="cover-crop-image" alt="Xem trước ảnh bìa" draggable="false">
      <div id="cover-crop-frame" class="cover-crop-frame" aria-hidden="true"></div>
    </div>
    <label class="cover-crop-zoom" for="cover-crop-zoom">
      <span>Thu phóng</span>
      <input id="cover-crop-zoom" type="range" min="1" max="4" step="0.01" value="1">
      <span id="cover-crop-zoom-label">1×</span>
    </label>
    <div class="cover-crop-actions">
      <button id="cover-crop-cancel" type="button">Hủy</button>
      <button id="cover-crop-rotate" type="button">Xoay ⟳</button>
      <button id="cover-crop-done" type="button">Xong</button>
    </div>
  </div>

  <!-- Image full-screen overlay -->
  <div id="send-gather-overlay" class="send-gather-overlay" aria-hidden="true"></div>
  <div id="img-overlay">
    <img id="img-overlay-img" src="" alt="">
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
