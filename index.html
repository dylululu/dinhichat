<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DiNhiChat">
  <meta name="theme-color" content="#e91e63">
  <title>DiNhiChat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root {
      --primary-color: #e91e63;
      --primary-dark: #c2185b;
      --bg-gray: #f5f5f7;
      --bubble-gray: #e9e9eb;
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Screen management */
    .screen {
      display: none;
      height: 100%;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .screen.active {
      display: flex;
    }

    /* Auth Screen */
    #auth-screen {
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .auth-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
    }

    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .auth-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-color);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:active {
      background-color: var(--primary-dark);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-error {
      color: #d32f2f;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* Chat Screen */
    #chat-screen {
      background: #ffffff;
      height: 100%;
    }

    .chat-header {
      background: #ffffff;
      border-bottom: 1px solid #eaeaea;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .header-title-wrap h1 {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-status {
      font-size: 12px;
      color: #34c759;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-notify {
      background: #fff0f5;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-notify:active {
      background: #ffe0ec;
    }

    .btn-logout {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 6px;
    }

    /* Notice Banner */
    .notice-banner {
      background: #fff8e1;
      color: #b78103;
      padding: 8px 14px;
      font-size: 12px;
      text-align: center;
      border-bottom: 1px solid #ffe082;
      display: none;
    }

    /* Messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f7f7f9;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .message-row.self {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message-row.self .message-bubble {
      background-color: var(--primary-color);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.other .message-bubble {
      background-color: var(--bubble-gray);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Image bubble */
    .msg-image {
      max-width: 100%;
      border-radius: 14px;
      display: block;
      min-height: 150px;
      background: #eee;
      cursor: pointer;
      object-fit: cover;
    }

    .msg-image-wrap {
      padding: 4px;
      border-radius: 18px;
      overflow: hidden;
      max-width: 220px;
    }

    .message-row.self .msg-image-wrap {
      background: var(--primary-color);
      border-bottom-right-radius: 4px;
    }

    .message-row.other .msg-image-wrap {
      background: var(--bubble-gray);
      border-bottom-left-radius: 4px;
    }

    /* Image Overlay */
    #img-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #img-overlay.open {
      display: flex;
    }

    #img-overlay img {
      max-width: 95vw;
      max-height: 92vh;
      border-radius: 8px;
      object-fit: contain;
    }

    /* Chat Input */
    .chat-input-bar {
      padding: 10px 14px;
      background: #ffffff;
      border-top: 1px solid #eaeaea;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      flex-shrink: 0;
      position: relative;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 15px;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--primary-color);
    }

    .btn-send {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-send:active {
      background-color: var(--primary-dark);
    }

    .btn-attach {
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Attach menu */
    .attach-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 14px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.14);
      overflow: hidden;
      z-index: 10;
      flex-direction: column;
      min-width: 160px;
    }

    .attach-menu.open {
      display: flex;
    }

    .attach-menu-item {
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      background: transparent;
      border: none;
      text-align: left;
    }

    .attach-menu-item:active {
      background: #f0f0f0;
    }

    .w {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .wm {
      align-self: flex-end;
      align-items: flex-end;
    }

    .wt {
      align-self: flex-start;
      align-items: flex-start;
    }

    .w .b {
      max-width: 100%;
    }

    .nm {
      font-size: 12px;
      color: #888;
      margin: 0 6px 2px;
    }
  </style>
</head>

<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <img src="icon-192.png" alt="DiNhiChat Logo" class="auth-logo">
      <h1 class="auth-title">DiNhiChat</h1>
      <p class="auth-desc">Chat riêng tư cho 2 người</p>
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="input-field" placeholder="email@example.com" required
            autocomplete="username">
        </div>
        <div class="input-group">
          <label for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" class="input-field" placeholder="Mật khẩu" required
            autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login" class="btn">Đăng nhập</button>
        <div id="login-error" class="auth-error"></div>
      </form>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen">
    <header class="chat-header">
      <div class="header-user-info">
        <div class="header-avatar" id="current-user-avatar">DN</div>
        <div class="header-title-wrap">
          <h1 id="chat-title">DiNhiChat</h1>
          <div class="header-status" id="user-status">Trực tuyến</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-enable-notify" class="btn-notify">🔔 Bật thông báo</button>
        <button id="btn-logout" class="btn-logout">Thoát</button>
      </div>
    </header>

    <div id="pwa-install-banner" class="notice-banner">
      Để nhận thông báo trên iPhone: Bấm nút <strong>Chia sẻ</strong> (biểu tượng hộp có mũi tên) → <strong>Thêm vào Màn
        hình chính</strong>.
    </div>

    <main class="chat-messages" id="messages-container">
      <!-- Bubbles will be rendered here -->
    </main>

    <footer class="chat-input-bar">
      <!-- Attach menu -->
      <div id="attach-menu" class="attach-menu">
        <button class="attach-menu-item" id="btn-camera">📷 Chụp ảnh</button>
        <button class="attach-menu-item" id="btn-gallery">🖼️ Thư viện</button>
      </div>
      <!-- Hidden file inputs -->
      <input type="file" id="file-camera" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="file-gallery" accept="image/*" multiple style="display:none">

      <button id="btn-attach" class="btn-attach" type="button">📎</button>
      <input type="text" id="message-input" class="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
      <select id="remind-select" class="remind-select" style="padding: 8px 4px; border-radius: 14px; border: 1px solid #ddd; font-size: 13px; background: #fff; outline: none; max-width: 115px;">
        <option value="none" selected>🔕 Không nhắc</option>
        <option value="1">🔔 Nhắc 1 lần</option>
        <option value="2">🔔 Nhắc 2 lần</option>
        <option value="loop">🔁 Nhắc liên tục</option>
      </select>
      <button id="btn-send" class="btn-send">Gửi</button>
    </footer>
  </div>

  <!-- Image full-screen overlay -->
  <div id="img-overlay">
    <img id="img-overlay-img" src="" alt="">
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
